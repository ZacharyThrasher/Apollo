# Every change that lands on main becomes a GitHub Release that installed copies of Apollo pick
# up by themselves (crates/updater; Settings > Window > Install updates automatically).
#
# Builds the same package scripts\package.ps1 makes by hand (Apollo.exe, libmpv, the pinned
# yt-dlp and deno, the login helper), zips it as Apollo-<version>-win-x64.zip next to a .sha256
# file, and publishes both under the tag v<version>. The version is 0.1.<run number>: it only
# ever goes up. The repository is public: nothing in here reads a secret, a cookie or an
# account, and the only token is the workflow's own, scoped to this repository.
#
# Run by hand from the Actions tab on any branch to check the build without publishing.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (only from main)
        type: boolean
        default: false

# One build at a time, so releases come out in the order they were pushed.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Pinned tools (libmpv, yt-dlp, deno)
        shell: pwsh
        run: scripts\setup-m0-tools.ps1

      - name: Test the updater on Windows
        shell: pwsh
        run: |
          cargo test -p apollo-updater --locked
          if ($LASTEXITCODE -ne 0) { throw 'updater tests failed' }

      - name: Package
        shell: pwsh
        run: |
          scripts\package.ps1 -Dest "$PWD\dist\Apollo" -Version $env:VERSION -NoShortcuts
          if ($LASTEXITCODE -ne 0) { throw 'package failed' }
          foreach ($f in 'Apollo.exe', 'libmpv-2.dll', 'apollo-login-helper.exe', 'tools\yt-dlp\yt-dlp.exe', 'tools\deno\deno.exe') {
            if (-not (Test-Path "dist\Apollo\$f")) { throw "package is missing $f" }
          }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $zip = "dist\Apollo-$env:VERSION-win-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD\dist\Apollo", "$PWD\$zip", [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Apollo-$env:VERSION-win-x64.zip" | Set-Content -Encoding ascii "$zip.sha256"
          Get-ChildItem dist -File | ForEach-Object { '{0,10:N1} MB  {1}' -f ($_.Length / 1MB), $_.Name }

      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" "dist\Apollo-$env:VERSION-win-x64.zip" "dist\Apollo-$env:VERSION-win-x64.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Apollo $env:VERSION" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      - name: Keep the newest 15 releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $all = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,createdAt | ConvertFrom-Json
          $all | Sort-Object createdAt -Descending | Select-Object -Skip 15 | ForEach-Object {
            gh release delete $_.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
