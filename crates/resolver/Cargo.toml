[package]
name = "apollo-resolver"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "yt-dlp stream resolver implementing apollo_runtime::Resolver (Job Object contained, no secrets in argv)"

[features]
# Enables the fake yt-dlp used by the test suite and a few test-only config hooks.
test-support = []

[dependencies]
apollo-domain = { path = "../domain" }
apollo-runtime = { path = "../runtime" }
apollo-services-common = { path = "../services-common" }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
apollo-resolver = { path = ".", features = ["test-support"] }
apollo-domain = { path = "../domain", features = ["test-support"] }

[[bin]]
name = "apollo-fake-ytdlp"
path = "src/bin/fake_ytdlp.rs"
required-features = ["test-support"]
