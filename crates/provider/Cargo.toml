[dependencies]
apollo-domain = { path = "../domain" }
apollo-innertube = { path = "../innertube" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"
