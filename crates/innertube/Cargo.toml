[package]
name = "apollo-innertube"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "InnerTube metadata client vendored from Limusic (GPL-3.0-or-later); see NOTICE.md"

[lib]
name = "innertube"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
tokio = { version = "1", features = ["time", "sync"] }
sha1 = "0.10"
hex = "0.4"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
