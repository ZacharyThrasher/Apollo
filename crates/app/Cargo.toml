[package]
name = "apollo-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Apollo desktop app: GPUI window, title bar, nav rail and player bar"

[lib]
name = "apollo_app"
path = "src/lib.rs"

[[bin]]
name = "apollo"
path = "src/main.rs"

[features]
default = []
# Runs against the real M2 services (account, yt-dlp resolver, libmpv) instead of the
# simulated backend. Windows only; needs the pinned tools under `tools/`.
real-services = [
    "provider",
    "dep:ureq",
    "dep:apollo-media",
    "dep:apollo-resolver",
]

# The InnerTube-backed library source (cross-platform; `real-services` turns it on).
provider = [
    "dep:apollo-innertube",
    "dep:ureq",
    "tokio/rt-multi-thread",
]

[dependencies]
apollo-account = { path = "../account" }
apollo-domain = { path = "../domain" }
apollo-innertube = { path = "../innertube", optional = true }
apollo-lyrics = { path = "../lyrics" }
apollo-provider = { path = "../provider" }
apollo-runtime = { path = "../runtime" }
apollo-services-common = { path = "../services-common" }
apollo-store = { path = "../store" }
apollo-theme = { path = "../theme" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "f37989fbdf840b308892af66516c2b9c3ef3853a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f37989fbdf840b308892af66516c2b9c3ef3853a" }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "net"] }
unicode-segmentation = "1"
ureq = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
apollo-media = { path = "../media", optional = true }
apollo-resolver = { path = "../resolver", optional = true }
# OS media controls (SMTC) on the window GPUI already owns; no second event loop (ADR 0001).
# Pulls `windows` 0.44 beside GPUI's 0.62: duplicate crates, harmless (docs/build-baseline.md).
raw-window-handle = "0.6"
souvlaki = { version = "=0.8.3", default-features = false }
tray-icon = "0.26"
# System-wide hotkeys (RegisterHotKey) on GPUI's own message loop, like the tray icon.
global-hotkey = "0.8"

# Core Audio (default output device, other apps' audio sessions) and the suspend/resume notice
# for pc_watch_win.rs. Same version as GPUI's own `windows`, so no extra copy.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Embeds assets/apollo.ico as the exe/window icon (no-op off Windows).
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f37989fbdf840b308892af66516c2b9c3ef3853a", features = ["test-support"] }
